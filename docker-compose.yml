services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      # memory | postgres
      STORAGE: ${STORAGE:-postgres}
      POSTGRES_DSN: postgres://posts:posts@db:5432/posts?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: posts
      POSTGRES_DB: posts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
